services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wordpaper
      POSTGRES_USER: wordpaper
      POSTGRES_PASSWORD: wordpaper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordpaper"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      WORDPAPER_DATABASE_URL: postgresql+psycopg://wordpaper:wordpaper@db:5432/wordpaper
      WORDPAPER_STORAGE_ROOT: /app/.data/storage
      WORDPAPER_FRONTEND_ORIGIN: http://localhost:8080
    volumes:
      - render_storage:/app/.data/storage
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  postgres_data:
  render_storage:
